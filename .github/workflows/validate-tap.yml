name: Validate tap syntax and automation policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-tap-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  tap:
    name: Tap syntax, style, and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew and the tap checkout
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ github.token }}

      - name: Check syntax and style across the full tap
        run: |
          brew readall --aliases --os=all --arch=all chakachakakhan/tap
          brew style Formula/*.rb Casks/*.rb

      - name: Run all updater and publication policy tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
