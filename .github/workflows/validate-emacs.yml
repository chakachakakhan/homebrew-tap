name: Validate Emacs

on:
  push:
    branches: [main]
    paths:
      - Formula/emacs.rb
      - Casks/emacs-pgtk-linux.rb
      - .github/workflows/validate-emacs.yml
      - .github/workflows/publish-emacs.yml
      - .github/scripts/*emacs*
      - .github/scripts/merge_update.py
  pull_request:
    paths:
      - Formula/emacs.rb
      - Casks/emacs-pgtk-linux.rb
      - .github/workflows/validate-emacs.yml
      - .github/workflows/publish-emacs.yml
      - .github/workflows/update-emacs.yml
      - .github/scripts/*emacs*
      - .github/scripts/merge_update.py
  workflow_dispatch:
    inputs:
      published:
        description: Test the already-published bottle on main
        type: boolean
        default: false
      bottle_run_id:
        description: Retry with tested bottles from an earlier run (identical formula; owner only)
        type: string

permissions: {}

concurrency:
  group: validate-emacs-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  policy:
    name: Emacs update policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - name: Restrict published-bottle checks to main
        env:
          PUBLISHED: ${{ inputs.published }}
        run: |
          if [[ "$PUBLISHED" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Published-bottle checks can only run on main' >&2
            exit 1
          fi
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  build:
    name: Emacs bottle build (${{ matrix.runner }})
    if: github.event_name != 'push' && inputs.published != true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew and the tap
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ github.token }}

      - name: Check recipes
        run: |
          brew readall --aliases --os=all --arch=all chakachakakhan/tap
          brew style Formula/emacs.rb Casks/emacs-pgtk-linux.rb
          brew audit --formula --strict chakachakakhan/tap/emacs
          # Check this package, independently of GNU's homepage/release index.
          brew audit --cask --strict chakachakakhan/tap/emacs-pgtk-linux

      # Homebrew's test-bot builds, bottles, pours the bottle, checks linkage,
      # and runs the formula's real native-compilation test.
      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup

      - name: Verify the requested bottle retry
        if: inputs.bottle_run_id
        env:
          GH_TOKEN: ${{ github.token }}
          BOTTLE_RUN_ID: ${{ inputs.bottle_run_id }}
        run: |
          [[ "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]]
          [[ "$BOTTLE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          origin="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOTTLE_RUN_ID" \
            --jq '[.head_repository.full_name, .path] | join(" ")')"
          [[ "$origin" == "$GITHUB_REPOSITORY .github/workflows/validate-emacs.yml" ]]
          builds="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOTTLE_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '[.jobs[] | select(.name == "Emacs bottle build (ubuntu-24.04)" or .name == "Emacs bottle build (ubuntu-24.04-arm)") | .conclusion] | sort | join(" ")')"
          [[ "$builds" == 'success success' ]]

      - name: Download the previously tested bottle
        if: inputs.bottle_run_id
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.bottle_run_id }}
          name: bottles_${{ matrix.runner }}
          path: ${{ runner.temp }}/emacs-retry

      - name: Build and test the bottle
        env:
          BOTTLE_RUN_ID: ${{ inputs.bottle_run_id }}
        run: |
          shopt -s nullglob
          if [[ -n "$BOTTLE_RUN_ID" ]]; then
            bottles=("$RUNNER_TEMP"/emacs-retry/emacs--*.bottle*.tar.gz)
            (( ${#bottles[@]} == 1 ))
            # Reuse only the exact recipe embedded in the previously tested binary.
            tar --extract --to-stdout --file "${bottles[0]}" --wildcards 'emacs/*/.brew/emacs.rb' \
              | cmp Formula/emacs.rb -
            HOMEBREW_DEVELOPER=1 brew install --only-dependencies "${bottles[0]}"
            HOMEBREW_DEVELOPER=1 brew install "${bottles[0]}"
            brew test chakachakakhan/tap/emacs
            brew linkage --test --strict chakachakakhan/tap/emacs
            cp -- "$RUNNER_TEMP"/emacs-retry/emacs--*.bottle.json "${bottles[0]}" .
          else
            # Downloads verify SHA-256; mirror availability must not discard a tested bottle.
            brew test-bot --only-formulae --skip-dependents --skip-online-checks --testing-formulae=chakachakakhan/tap/emacs
          fi
          bottles=(emacs--*.bottle*.tar.gz)
          if (( ${#bottles[@]} != 1 )); then
            printf 'Expected one tested Emacs bottle, found %s\n' "${#bottles[@]}" >&2
            exit 1
          fi
          bottle_json="${bottles[0]%%.bottle.*}.bottle.json"
          bottle_jsons=(emacs--*.bottle.json)
          if (( ${#bottle_jsons[@]} != 1 )) || [[ "${bottle_jsons[0]}" != "$bottle_json" ]]; then
            printf 'Expected bottle metadata file %s\n' "$bottle_json" >&2
            exit 1
          fi
      - name: Upload tested bottle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.runner }}
          path: |
            emacs--*.bottle.json
            emacs--*.bottle*.tar.gz
          if-no-files-found: error
          overwrite: true

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emacs-logs_${{ matrix.runner }}
          path: ${{ github.workspace }}/logs/
          overwrite: true

  runtime:
    name: Emacs runtime (${{ matrix.runner }})
    needs: build
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' ||
       (inputs.published == true && github.ref == 'refs/heads/main') ||
       needs.build.result == 'success')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      actions: read
      contents: read
    steps:
      - name: Set up Homebrew and the tap
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ github.token }}

      - name: Download this run's tested bottle
        if: github.event_name != 'push' && inputs.published != true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bottles_${{ matrix.runner }}
          path: ${{ runner.temp }}/emacs-bottle

      - name: Install the tested local bottle
        if: github.event_name != 'push' && inputs.published != true
        env:
          # Homebrew 7 permits local bottle files only in developer mode.
          HOMEBREW_DEVELOPER: "1"
        run: |
          shopt -s nullglob
          bottles=("$RUNNER_TEMP"/emacs-bottle/emacs--*.bottle*.tar.gz)
          if (( ${#bottles[@]} != 1 )); then
            printf 'Expected one downloaded Emacs bottle, found %s\n' "${#bottles[@]}" >&2
            exit 1
          fi
          brew install --only-dependencies "${bottles[0]}"
          brew install "${bottles[0]}"

      - name: Install the published bottle as a user would
        if: github.event_name == 'push' || inputs.published == true
        run: brew install --force-bottle chakachakakhan/tap/emacs

      - name: Install desktop integration around the poured bottle
        run: |
          brew install --only-dependencies chakachakakhan/tap/emacs
          brew install --cask chakachakakhan/tap/emacs-pgtk-linux
          brew test chakachakakhan/tap/emacs
          brew linkage --test chakachakakhan/tap/emacs
          test -s "$HOME/.local/share/icons/emacs.svg"
          grep -Fx "Exec=$(brew --prefix)/opt/emacs/bin/emacs %F" \
            "$HOME/.local/share/applications/emacs.desktop"
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils dbus-x11 weston desktop-file-utils
          desktop-file-validate "$HOME/.local/share/applications/emacs.desktop"
          desktop-file-validate "$HOME/.local/share/applications/emacsclient.desktop"

      - name: Exercise GUI, daemon, and terminal client on X11
        run: dbus-run-session -- xvfb-run -a python3 .github/scripts/smoke_emacs.py

      - name: Exercise GUI and daemon client on native Wayland
        run: dbus-run-session -- python3 .github/scripts/smoke_emacs.py --wayland

      - name: Check uninstall preserves Emacs and Doom settings
        run: |
          for directory in "$HOME/.emacs.d" "$HOME/.config/emacs" "$HOME/.config/doom"; do
            mkdir -p "$directory"
            touch "$directory/tap-ci-preserve"
          done
          brew uninstall --cask chakachakakhan/tap/emacs-pgtk-linux
          test -x "$(brew --prefix chakachakakhan/tap/emacs)/bin/emacs"
          brew uninstall --formula chakachakakhan/tap/emacs
          for artifact in \
            "$(brew --prefix)/bin/emacs" \
            "$(brew --prefix)/bin/emacsclient" \
            "$HOME/.local/share/applications/emacs.desktop" \
            "$HOME/.local/share/applications/emacsclient.desktop" \
            "$HOME/.local/share/icons/emacs.svg"; do
            test ! -e "$artifact"
            test ! -L "$artifact"
          done
          for directory in "$HOME/.emacs.d" "$HOME/.config/emacs" "$HOME/.config/doom"; do
            test -f "$directory/tap-ci-preserve"
          done

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emacs-logs_${{ matrix.runner }}
          path: ${{ github.workspace }}/logs/
          overwrite: true
