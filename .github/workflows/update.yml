name: Update ChatGPT cask

on:
  push:
    branches: [main]
    paths: [.github/workflows/update.yml]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.ref }}

      - name: Read official metadata and update the cask
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          base_url = "https://persistent.oaistatic.com/codex-app-prod/linux/deb"
          packages = {}
          for arch in ("amd64", "arm64"):
              url = f"{base_url}/dists/stable/main/binary-{arch}/Packages"
              index = subprocess.check_output([
                  "curl", "--proto", "=https", "--tlsv1.2", "--fail", "--silent",
                  "--show-error", "--location", "--retry", "3", "--max-time", "60", url,
              ], text=True)
              candidates = []
              for stanza in re.split(r"\n\s*\n", index.strip()):
                  fields = dict(
                      line.split(": ", 1) for line in stanza.splitlines()
                      if ": " in line and not line[0].isspace()
                  )
                  if fields.get("Package") != "chatgpt":
                      continue
                  version = fields.get("Version", "")
                  if not re.fullmatch(r"\d+(?:\.\d+)+", version):
                      raise ValueError(f"Unexpected upstream version: {version!r}")
                  candidates.append(fields)
              if not candidates:
                  raise ValueError(f"No ChatGPT package found for {arch}")
              package = max(candidates, key=lambda p: tuple(map(int, p["Version"].split("."))))
              version = package["Version"]
              if package.get("Architecture") != arch:
                  raise ValueError(f"Unexpected architecture for {arch}")
              if package.get("Filename") != f"pool/main/c/chatgpt/chatgpt_{version}_{arch}.deb":
                  raise ValueError(f"Unexpected package filename for {arch}")
              if not re.fullmatch(r"[0-9a-f]{64}", package.get("SHA256", "")):
                  raise ValueError(f"Invalid checksum for {arch}")
              packages[arch] = package

          version = packages["amd64"]["Version"]
          if version != packages["arm64"]["Version"]:
              raise ValueError("Architecture versions differ; wait for upstream to finish publishing")

          cask_path = Path("Casks/chatgpt-linux.rb")
          original = cask_path.read_text()
          current = re.search(r'^  version "([^"]+)"$', original, re.MULTILINE)
          if not current:
              raise ValueError("Cask version stanza is missing")
          if tuple(map(int, version.split("."))) < tuple(map(int, current[1].split("."))):
              raise ValueError("Refusing to downgrade the cask")

          updated = original
          replacements = [
              (r'^  version "[^"]+"$', f'  version "{version}"'),
              (r'^  sha256 arm64_linux:  "[0-9a-f]{64}",$',
               f'  sha256 arm64_linux:  "{packages["arm64"]["SHA256"]}",'),
              (r'^         x86_64_linux: "[0-9a-f]{64}"$',
               f'         x86_64_linux: "{packages["amd64"]["SHA256"]}"'),
          ]
          for pattern, replacement in replacements:
              updated, count = re.subn(pattern, replacement, updated, flags=re.MULTILINE)
              if count != 1:
                  raise ValueError(f"Expected exactly one cask stanza: {pattern}")
          if updated != original:
              cask_path.write_text(updated)
              print(f"Updated ChatGPT {current[1]} -> {version}")
          else:
              print(f"ChatGPT is current at {version}")
          PY

      - name: Open update pull request
        if: github.ref == 'refs/heads/main'
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.0.0
        with:
          add-paths: Casks/chatgpt-linux.rb
          branch: automation/update-chatgpt
          commit-message: "chatgpt-linux: update official package metadata"
          title: "chatgpt-linux: update official package metadata"
          body: |
            ChatGPT update notice for @${{ github.repository_owner }}.
            No review or approval is needed for this routine update.

            Update the version and both architecture checksums from OpenAI's
            official Linux package indexes. Downloads remain on OpenAI's origin.

            This PR merges automatically only after both architecture installation
            checks pass and a separate check confirms only version/checksum fields
            changed. Changes outside that scope require manual review.
            No application binaries are built or mirrored.

      # GITHUB_TOKEN-created PR runs can need human approval. An explicit
      # workflow_dispatch starts validation without a separate access token.
      - name: Dispatch installation checks for the update branch
        # Retry unchanged open PRs too, so transient runner/download failures recover.
        if: steps.pull-request.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATE_SHA: ${{ steps.pull-request.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          [[ "$UPDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run validate.yml --ref automation/update-chatgpt
          # An explicit dispatch also reaches the merger for bot-triggered runs.
          # GitHub suppresses the workflow_run handoff for these runs.
          for attempt in {1..12}; do
            run_id="$(gh api \
              "repos/$GH_REPO/actions/workflows/validate.yml/runs?event=workflow_dispatch&branch=automation/update-chatgpt&head_sha=$UPDATE_SHA&per_page=1" \
              --jq '.workflow_runs[0].id // empty')"
            if [[ -n "$run_id" ]]; then
              gh workflow run merge-update.yml --ref main --field validation_run_id="$run_id"
              exit 0
            fi
            sleep 5
          done
          echo 'Could not locate the dispatched validation run' >&2
          exit 1

      - name: Keep scheduled checks active during quiet release periods
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A monthly empty commit on a separate branch prevents GitHub's
          # 60-day inactivity shutdown without touching main or the cask.
          branch=automation/keepalive
          if git fetch origin "$branch"; then
            last_activity="$(git show -s --format=%ct FETCH_HEAD)"
          else
            last_activity=0
          fi
          if (( $(date +%s) - last_activity < 30 * 24 * 60 * 60 )); then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # commit-tree ignores any pending cask edit in the working directory.
          commit="$(git commit-tree HEAD^{tree} -p HEAD -m 'Keep scheduled cask updates active')"
          git push origin "$commit:refs/heads/$branch" --force
