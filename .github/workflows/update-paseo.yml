name: Update Paseo cask

on:
  schedule:
    - cron: "57 15 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.ref }}
      - name: Update from the complete official stable Linux release
        run: python3 .github/scripts/update_paseo.py
      - name: Open routine update pull request
        if: github.ref == 'refs/heads/main'
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.0.0
        with:
          add-paths: Casks/paseo-linux.rb
          branch: automation/update-paseo
          commit-message: "paseo-linux: update official release metadata"
          title: "paseo-linux: update official release metadata"
          body: |
            Update Paseo Linux's stable version and x86_64 archive SHA-256
            checksum from the official getpaseo/paseo release.
            The tap downloads the publisher's archive directly.

            A separate workflow merges the exact tested revision after the Linux
            install, desktop, CLI, preservation, and metadata policy checks pass.
      # Explicit dispatches bypass GitHub's suppression of bot-triggered PR events.
      # Retry unchanged open PRs so temporary runner failures recover.
      - name: Dispatch installation checks and trusted merger
        if: steps.pull-request.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATE_SHA: ${{ steps.pull-request.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          [[ "$UPDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run validate-paseo.yml --ref automation/update-paseo
          for _ in {1..12}; do
            run_id="$(gh api \
              "repos/$GH_REPO/actions/workflows/validate-paseo.yml/runs?event=workflow_dispatch&branch=automation/update-paseo&head_sha=$UPDATE_SHA&per_page=1" \
              --jq '.workflow_runs[0].id // empty')"
            if [[ -n "$run_id" ]]; then
              gh workflow run merge-paseo.yml --ref main --field validation_run_id="$run_id"
              exit 0
            fi
            sleep 5
          done
          echo 'Could not locate the dispatched validation run' >&2
          exit 1
